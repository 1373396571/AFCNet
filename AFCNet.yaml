# Parameters
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, nn.Identity, []]  # 0-P0             0

  # rgb
  - [0, 1, SilenceChannel, [0,3]]  # 1-P0    1
  - [-1, 1, Conv, [64, 3, 2]] # 3-P1/2       2
  - [-1, 1, FSE, [ 8, 0.1]]  #3
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4        4
  - [-1, 1, FSE, [ 6, 0.1]]        #5
  - [-1, 2, C3k2, [256, False, 0.25]]              #6
  - [-1, 1, Conv, [256, 3, 2]]                    #7
  - [-1, 2, C3k2, [512, False, 0.25]]                  # 8
  - [-1, 1, ShuffleNetV2Block, [128, 2]] # 5-P4/16       9
  - [-1, 2, ShuffleNetV2Block, [128, 1]]               #10

  # ir
  - [0, 1, SilenceChannel, [3,4]]  # 11-P0   11
  - [-1, 1, Conv, [64, 3, 2]] # 5-P1/2        12
  - [-1, 1, FSE, [ 8, 0.1]]    #13
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4          14
  - [-1, 1, FSE, [ 6, 0.1]] # 12-P1/2  15
  - [-1, 1, C3k2, [256, False, 0.25]]            #16
  - [-1, 1, Conv, [256, 3, 2]]                  #17
  - [-1, 2, C3k2, [512, False, 0.25]]     #        18
  - [-1, 1, ShuffleNetV2Block, [128, 2]] # 5-P4/16      19
  - [-1, 2, ShuffleNetV2Block, [128, 1]]               #20
  - [-1, 1, ShuffleNetV2Block, [256, 2]] # 7-P5/32       21
  - [-1, 2, ShuffleNetV2Block, [256, 1]]                 #22
  - [-1, 1, SPPF, [1024, 5]] #                          23
  - [-1, 2, C2PSA, [1024]] #                            24

  - [8, 1, DSDA , [2] ]       # 25
  - [[10, 20], 1, DSDA , [] ]       # 26
  - [24, 1, DSDA , [2] ]             #27



# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              #28
  - [[-1, 26], 1, Concat, [1]] # cat backbone P4            #29
  - [-1, 2, C3k2, [512, False]] # 13                        #30

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              #31
  - [[-1, 25], 1, Concat, [1]] # cat backbone P3            #32
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)           #33

  - [-1, 1, Conv, [256, 3, 2]]                              #34
  - [[-1, 30], 1, Concat, [1]] # cat head P4                #35
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)         #36

  - [-1, 1, Conv, [512, 3, 2]]                  #37         #37
  - [[-1, 27], 1, Concat, [1]] # cat head P5                #38
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)          #39

  - [ [3, 13], 1, ADD , [64] ]      # 40
  - [ [40, 33], 1, LDC, [256]]     # 41
  - [ [40, 36], 1, LDC, [512]]     # 42
  - [ [40, 39], 1, LDC, [1024]]    # 43

  - [[41, 42, 43], 1, Detect, [nc]] # Detect(P3, P4, P5)
